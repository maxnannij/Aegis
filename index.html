<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#10130f" />
  <title>Aegis – Tower Defense</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="app">
    <div id="map-container">
      <canvas id="map-canvas" width="480" height="640" aria-label="Mapa de juego"></canvas>
    </div>
    <div id="game-status"><span id="status" class="status">Path libre</span></div>
    <div class="legacy-controls" aria-hidden="true">
      <button id="btn-toggle-wall" type="button">Modo: Colocar Muro</button>
      <button id="btn-spawn" type="button">Spawnear enemigo</button>
      <button id="btn-clear-walls" type="button">Quitar todos los muros</button>
    </div>
  </main>
  <script type="module" src="src/main.js"></script>
</body>
</html>
